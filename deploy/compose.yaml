name: vista360-demo

x-app: &app
  image: vista360-demo:local
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://vista360:${POSTGRES_PASSWORD:?Configurar contraseña URL-safe}@db:5432/vista360
    APP_ENV: production
    COOKIE_SECURE: 'true'
    STORAGE_BACKEND: s3
    CORS_ORIGINS: '["https://${APP_HOST:?Configurar dominio HTTPS}"]'
    CSRF_SECRET: ${CSRF_SECRET:?Configurar secreto CSRF}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Configurar endpoint S3}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Configurar access key}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Configurar secret key}
    S3_BUCKET: ${S3_BUCKET:?Configurar bucket privado}
    S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:?Configurar bucket público separado}
    PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:?Configurar URL HTTPS de imágenes públicas}
    PORT: '8000'
  init: true

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vista360
      POSTGRES_USER: vista360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar contraseña}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vista360 -d vista360']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  migrate:
    <<: *app
    command: ['migrate']
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  web:
    <<: *app
    command: ['web']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *logging
  worker:
    <<: *app
    command: ['worker']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Configurar dominio}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

volumes:
  database:
  certificates:
  caddy_config:
