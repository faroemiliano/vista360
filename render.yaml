# Demo de una sola instancia: frontend + API + worker, PostgreSQL por 30 días.
# Los buckets S3 son externos; este archivo no contrata almacenamiento.
services:
  - type: web
    name: vision360-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: VISTA360_DEMO_MODE
        value: 'true'
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: vision360-demo-db
          property: connectionString
      - key: CSRF_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: vision360-demo-private
      - key: S3_PUBLIC_BUCKET
        value: vision360-demo-public
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: MAX_IMAGE_WIDTH
        value: '4096'
      - key: MAX_IMAGE_HEIGHT
        value: '2048'
      - key: MAX_IMAGE_PIXELS
        value: '8388608'
      - key: MAX_UPLOAD_BYTES
        value: '10485760'
      - key: ORGANIZATION_TOUR_LIMIT
        value: '3'
      - key: ORGANIZATION_MEMBER_LIMIT
        value: '3'
      - key: ORGANIZATION_STORAGE_QUOTA_BYTES
        value: '268435456'
      - key: OWNER_STORAGE_QUOTA_BYTES
        value: '268435456'
      - key: TOUR_STORAGE_QUOTA_BYTES
        value: '134217728'

databases:
  - name: vision360-demo-db
    plan: free
    region: oregon
    databaseName: vision360
    user: vision360
    postgresMajorVersion: '17'
    ipAllowList: []
