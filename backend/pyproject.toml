[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vista360-backend"
version = "0.1.0"
description = "Base de la API de Vista360"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
]

[tool.setuptools.packages.find]
include = ["app*"]
